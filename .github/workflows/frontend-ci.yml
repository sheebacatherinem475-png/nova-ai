name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: ./frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run TypeScript Compiler Checks
      run: npx tsc --noEmit

    - name: Run Jest Tests
      run: npm run test

    - name: Run npm audit (Security Scan)
      run: npm audit --audit-level=high
      # We allow failure here optionally, or strictly fail
      continue-on-error: true

    - name: Build Next.js
      run: npm run build

    - name: Build Docker Image
      run: docker build -t nova-frontend:test .

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'nova-frontend:test'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
